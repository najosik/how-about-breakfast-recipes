name: Seoul Now - bike foreigner analysis

# 따릉이 대여소별 외국인·내국인 이용 추정 → seoul-now/bike/data/bike-foreigner.json
# 행정동 외국인 비율은 버스 분석(seoul-now-bus.yml)이 저장한 dong-hourly.json을 쓰므로 그 다음 날 실행.
on:
  schedule:
    - cron: '0 3 6,21 * *'   # 매월 6일·21일 12:00 KST
  workflow_dispatch:
    inputs:
      target_ym:
        description: '따릉이 기준월 YYYYMM (비우면 생활인구 기준월과 같게)'
        required: false
        default: ''
      force:
        description: '같은 기준월이어도 다시 계산'
        type: boolean
        default: false

permissions:
  contents: write

# 이용권 집계 원천 응답이 페이지당 1분 이상 걸려 수 시간 걸릴 수 있다.
# 공용 잠금(main-branch-writer)을 오래 잡으면 다른 수집이 밀리므로 별도 그룹을 쓰고,
# bike/data만 커밋하며 push가 거절되면 rebase 후 재시도한다.
concurrency:
  group: seoul-now-bike
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: seoul-now
    steps:
      # 공급망 공격 방지를 위해 커밋 SHA로 고정 (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Unit tests
        run: python3 -m unittest discover -s analysis -q

      - name: Analyze
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          TARGET_YM: ${{ inputs.target_ym }}
          FORCE: ${{ inputs.force && '1' || '' }}
          SEOUL_HTTP_TIMEOUT: '150'
          BEHAVIOR_BUDGET: '16200'
        run: |
          if [ -z "$SEOUL_API_KEY" ]; then
            echo "::warning::SEOUL_API_KEY secret is not set - skipping."
            exit 0
          fi
          python3 -u analysis/bike_foreigner.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bike/data
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
            exit 0
          fi
          git commit -m "Seoul Now: update bike foreigner analysis"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing onto latest main (attempt $i)..."
            git pull --rebase origin main
            sleep $((i * 5))
          done
          echo "::error::Push failed after 3 attempts."
          exit 1
