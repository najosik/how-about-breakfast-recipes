name: Instagram token refresh

# Instagram long-lived tokens expire 60 days after issue; refreshing once a
# week keeps them alive with no manual renewal. The new token goes to the
# PRIVATE insights R2 bucket only - see insights/ig_token.py. A failure
# here leaves the previous token in place (it is still valid for weeks) and
# shows up on the dashboard's token badge.

on:
  schedule:
    # Mondays 03:17 UTC (12:17 KST), off the busy top of the hour
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ig-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSIGHTS_R2_ENDPOINT: ${{ secrets.INSIGHTS_R2_ENDPOINT }}
          INSIGHTS_R2_ACCESS_KEY_ID: ${{ secrets.INSIGHTS_R2_ACCESS_KEY_ID }}
          INSIGHTS_R2_SECRET_ACCESS_KEY: ${{ secrets.INSIGHTS_R2_SECRET_ACCESS_KEY }}
          INSIGHTS_R2_BUCKET: ${{ secrets.INSIGHTS_R2_BUCKET }}
        run: python insights/ig_token.py refresh
