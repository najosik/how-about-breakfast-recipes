name: Apply content edit

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'page_id of the record to edit'
        required: true
        type: string
      patch:
        description: 'JSON object of fields to update'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply edit to recipes.json
        env:
          PAGE_ID: ${{ inputs.page_id }}
          PATCH_JSON: ${{ inputs.patch }}
        run: python apply_edit.py

      - name: Rebuild site data
        run: python build_public_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Content edit via admin tool: ${{ inputs.page_id }}"
            git push
          fi
