name: Insights token check (temporary)

# One-off check that IG_ACCESS_TOKEN can read insights. Prints only OK / the
# API error code - never the token or any insight value (public repo logs).
on:
  push:
    branches: [claude/instagram-analytics-dashboard-sf1tc2]
    paths: ['.github/workflows/insights-token-check.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token permissions
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.parse, urllib.request
          token, uid = os.environ['IG_ACCESS_TOKEN'], os.environ['IG_USER_ID']
          base = 'https://graph.instagram.com/v23.0/'

          def call(label, path, params):
              params = dict(params, access_token=token)
              try:
                  with urllib.request.urlopen(base + path + '?' + urllib.parse.urlencode(params), timeout=30) as r:
                      body = json.loads(r.read().decode())
                  print(f'[OK]   {label}')
                  return body
              except urllib.error.HTTPError as e:
                  try:
                      err = json.loads(e.read().decode()).get('error', {})
                  except ValueError:
                      err = {}
                  print(f"[FAIL] {label}: HTTP {e.code} code={err.get('code')} "
                        f"subcode={err.get('error_subcode')} type={err.get('type')} "
                        f"message={str(err.get('message', ''))[:160]}")
                  return None

          if not token or not uid:
              raise SystemExit('[FAIL] IG_ACCESS_TOKEN or IG_USER_ID secret is empty')
          call('profile (basic permission)', uid, {'fields': 'id'})
          call('account insights: reach', f'{uid}/insights',
               {'metric': 'reach', 'period': 'day', 'metric_type': 'total_value'})
          call('account insights: reach by follow_type', f'{uid}/insights',
               {'metric': 'reach', 'period': 'day', 'metric_type': 'total_value', 'breakdown': 'follow_type'})
          call('account insights: follower_count', f'{uid}/insights', {'metric': 'follower_count', 'period': 'day'})
          media = call('media list', f'{uid}/media', {'fields': 'id,media_product_type', 'limit': 1})
          if media and media.get('data'):
              mid = media['data'][0]['id']
              call('post insights: reach,views,saved,shares', f'{mid}/insights', {'metric': 'reach,views,saved,shares'})
              call('post insights: reach by follow_type', f'{mid}/insights', {'metric': 'reach', 'breakdown': 'follow_type'})
