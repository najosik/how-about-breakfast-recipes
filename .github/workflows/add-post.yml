name: Add missing post

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD) for the new record'
        required: true
        type: string
      patch:
        description: 'JSON object of fields for the new record'
        required: true
        type: string

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add new record to recipes.json
        env:
          DATE: ${{ inputs.date }}
          PATCH_JSON: ${{ inputs.patch }}
        run: python add_post.py

      - name: Rebuild site data
        run: python build_public_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add missing post via admin tool: ${{ inputs.date }}"
            git push
          fi
