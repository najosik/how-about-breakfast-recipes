name: Seoul Now - UI check (one-off)

# 1회 진단: 실제 사이트에서 번역 버튼 동작을 브라우저로 확인하고 오류를 로그로 남긴다. 저장소에 쓰지 않음.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소"
        default: "https://how-about-breakfast.com/seoul-now/?lang=ko"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 공급망 공격 방지를 위해 커밋 SHA로 고정 (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Playwright (pinned)
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check translate button
        env:
          CHECK_URL: ${{ inputs.url }}
        run: cp seoul-now/analysis/ui_check.mjs . && node ui_check.mjs "$CHECK_URL"
