name: Seoul Now - TourAPI restaurants

# 한국관광공사 TourAPI(v2) 서울 음식점 목록 → seoul-now/data/tour_food.json (하루 1회)
# 상세(detailIntro2)는 수집하지 않는다(컨시어지가 질의 시 조회).
on:
  schedule:
    - cron: '10 19 * * *'   # 매일 04:10 KST (다른 수집 작업과 겹치지 않게)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: seoul-now
    steps:
      # 공급망 공격 방지를 위해 커밋 SHA로 고정 (actions/checkout v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Unit tests
        run: python3 -m unittest discover -s scripts -q

      - name: Fetch restaurants
        id: fetch
        env:
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
        run: |
          if [ -z "$TOURAPI_KEY" ]; then
            echo "::warning::TOURAPI_KEY secret is not set - skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/fetch_tour_food.py

      - name: Commit and push if changed
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tour_food.json
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
            exit 0
          fi
          git commit -m "Seoul Now: update TourAPI restaurants"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing onto latest main (attempt $i)..."
            git pull --rebase origin main
            sleep $((i * 5))
          done
          echo "::error::Push failed after 3 attempts."
          exit 1
