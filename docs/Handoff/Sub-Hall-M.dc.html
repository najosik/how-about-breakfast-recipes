<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>명예의 전당 — 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,800;1,9..144,400&amp;display=swap">
<style>
body{margin:0;background:#FBFBF8}
a{color:#3F5E47}a:hover{color:#2C4533}
</style>
</helmet>
<div style="width: 390px; height: 1900px; box-sizing: border-box; background: #FBFBF8; color: #1C1C1A; font-family: 'Noto Sans KR', sans-serif; word-break: keep-all; display: flex; flex-direction: column">

<header style="margin: 0 20px; height: 60px; border-bottom: 3px solid #1C1C1A; display: flex; align-items: center; justify-content: space-between">
<a href="B-Mobile.dc.html" style="font-family: 'Noto Serif KR', serif; font-size: 24px; font-weight: 900; letter-spacing: -0.04em; color: #1C1C1A; text-decoration: none">날마다, 조식</a>
<button aria-label="메뉴" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; color: #1C1C1A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>

<section style="padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; letter-spacing: 0.14em; font-weight: 700; color: #3F5E47">HALL OF FAME</span>
<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 36px; font-weight: 900; letter-spacing: -0.02em">명예의 전당</h1>
<p style="margin: 0; font-size: 15px; color: #4A4943">여러분이 뽑은, 또 먹고 싶은 아침들.</p>
<div role="tablist" aria-label="기간" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #1C1C1A">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 44px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 14px">{{t.label}}</button>
</sc-for>
</div>
</section>

<section style="padding: 12px 20px 8px">
<a href="Sub-Recipe-M.dc.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #1C1C1A">
<div style="position: relative">
<img src="/_blob/c1f0061bd6d287c5c36a16149380fe45" alt="하몽 아스파라거스 플레이트" style="display: block; width: 350px; height: 280px; object-fit: cover">
<span style="position: absolute; left: 0; top: 0; padding: 8px 14px 6px; background: #55795E; color: #FFFFFF; font-family: 'Fraunces', serif; font-size: 44px; font-weight: 800; line-height: 1">1</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 900">하몽 아스파라거스 플레이트</span><span style="font-family: 'Fraunces', serif; font-size: 17px; font-weight: 800; color: #3F5E47">[n]표</span></div>
</a>
</section>

<section style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{podium}}" as="p" hint-placeholder-count="2">
<a href="Sub-Recipe-M.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #1C1C1A">
<div style="position: relative">
<img src="{{p.img}}" alt="{{p.title}}" style="display: block; width: 100%; height: 140px; object-fit: cover">
<span style="position: absolute; left: 0; top: 0; padding: 4px 10px 3px; background: #1C1C1A; color: #FBFBF8; font-family: 'Fraunces', serif; font-size: 26px; font-weight: 800; line-height: 1">{{p.rank}}</span>
</div>
<span style="font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 700; line-height: 1.4">{{p.title}}</span>
<span style="font-family: 'Fraunces', serif; font-size: 14px; font-weight: 800; color: #3F5E47">[n]표</span>
</a>
</sc-for>
</section>

<section style="padding: 28px 20px 24px">
<ol style="margin: 0; padding: 0; list-style: none; border-top: 1px solid #1C1C1A">
<sc-for list="{{rest}}" as="r" hint-placeholder-count="7">
<li style="min-height: 68px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #D9D8D2">
<span style="width: 28px; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 800; color: #B5B3AA">{{r.rank}}</span>
<a href="Sub-Recipe-M.dc.html" style="flex-grow: 1; font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 700; color: #1C1C1A; text-decoration: none">{{r.title}}</a>
<button onClick="{{r.vote}}" aria-pressed="{{r.voted}}" style="width: 76px; height: 44px; border: 1px solid #1C1C1A; background: {{r.bg}}; color: {{r.fg}}; font: inherit; font-size: 13px; font-weight: 700">{{r.label}}</button>
</li>
</sc-for>
</ol>
</section>

<section style="margin: 0 20px 32px; padding: 22px; background: #EBF1EA; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 900">또 먹고 싶은 아침에 한 표.</span>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #3A3934">[투표 규칙 — 예: 하루 한 번, 로그인 없이]</p>
<a href="Sub-Privacy-D.dc.html" style="font-size: 13px">투표 시 처리되는 정보 안내 →</a>
</section>

<footer style="margin: auto 20px 0; padding: 20px 0 32px; border-top: 3px solid #1C1C1A; font-size: 13px; color: #4A4943">© how.about.breakfast 2020–2026</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: '전체', voted: {} }; }
  renderVals() {
    var self = this, st = this.state;
    var tabs = ['이번 달', '올해', '전체'].map(function (l) {
      var on = st.tab === l;
      return { label: l, on: on, bg: on ? '#1C1C1A' : 'transparent', fg: on ? '#FBFBF8' : '#1C1C1A', pick: function () { self.setState({ tab: l }); } };
    });
    var rest = ['소시지를 곁들인 대파 샐러드', '[메뉴명]', '[메뉴명]', '[메뉴명]', '[메뉴명]', '[메뉴명]', '[메뉴명]'].map(function (t, i) {
      var v = !!st.voted[i];
      return { rank: String(i + 4), title: t, voted: v, label: v ? '✓' : '한 표', bg: v ? '#55795E' : 'transparent', fg: v ? '#FFFFFF' : '#1C1C1A',
        vote: function () { var o = Object.assign({}, st.voted); o[i] = !v; self.setState({ voted: o }); } };
    });
    return {
      tabs: tabs, rest: rest,
      podium: [
        { rank: '2', title: '안성재 셰프의 마늘 라면', img: '/_blob/e3ed829b81e8a0acef4a993bc7807854' },
        { rank: '3', title: '아보카도 에그 타코', img: '/_blob/ed68926960f352fccf62f5d6755bcd99' }
      ]
    };
  }
}
</script>
</body>
</html>
