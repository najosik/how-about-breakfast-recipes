<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 외부 스크립트·인라인 스크립트 금지 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Seoul Festival Calendar · 서울 축제 캘린더</title>
  <meta name="description" content="Expected dates of Seoul's recurring festivals next year, forecast from past years.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <a id="back" class="back-link" href="../"></a>
        <h1 id="site-title"></h1>
        <p id="site-sub" class="sub"></p>
      </div>
      <button id="lang-toggle" class="lang-btn" type="button">한국어</button>
    </div>
  </header>

  <main class="wrap">
    <p id="basis" class="basis"></p>

    <!-- 예측 흐름(보고서 10쪽): 축제 기록 → 같은 축제끼리 묶기 → 반복 축제만 → 예측 -->
    <section class="cal-funnel" aria-labelledby="funnel-title">
      <h2 id="funnel-title"></h2>
      <ol id="funnel" class="funnel"></ol>
    </section>

    <!-- 월별 분포(보고서 11쪽): 4~5월 강조 -->
    <section class="cal-bars" aria-labelledby="bars-title">
      <div class="bars-head"><h2 id="bars-title"></h2><p id="bars-note" class="bars-note"></p></div>
      <div id="bars" class="bars" role="list"></div>
      <details class="bars-table"><summary id="bars-table-toggle"></summary><div id="bars-table"></div></details>
    </section>

    <section class="cal-about" aria-labelledby="about-title">
      <h2 id="about-title"></h2>
      <p id="about-text"></p>
      <ul id="legend" class="legend"></ul>
    </section>

    <section class="cal-controls" aria-label="Filters">
      <div class="ctl-row">
        <div id="conf-chips" class="chips" role="group"></div>
        <div id="view-chips" class="chips view" role="group"></div>
      </div>
      <nav id="month-nav" class="month-nav" aria-label="Months"></nav>
    </section>

    <div id="months"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="updated"></p>
      <p id="source"></p>
    </div>
  </footer>

  <script src="calendar.js"></script>
</body>
</html>
