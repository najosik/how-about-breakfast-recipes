<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 외부 스크립트·인라인 스크립트 금지 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com https://translate.googleapis.com; img-src 'self' https: data:; connect-src 'self' https://translate.googleapis.com https://translate-pa.googleapis.com; frame-src https://translate.google.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Seoul Promotion & Marketing Calendar · Seoul Now</title>
  <meta name="description" content="Next year's major Seoul events for promotion and marketing, forecast from when they were held before.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css?v=20261007b">
  <link rel="stylesheet" href="calendar.css?v=20261007b">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <a id="back" class="back-link" href="../"></a>
        <h1 id="site-title"></h1>
        <p id="site-sub" class="sub"></p>
      </div>
      <div class="gt-wrap notranslate">
        <button id="gt-btn" class="lang-btn" type="button" aria-label="Translate this page · 페이지 번역">🌐 Translate · 번역</button>
        <div id="google_translate_element" hidden></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="basis" class="basis"></p>

    <!-- 예측 흐름(보고서 10쪽): 축제 기록 → 같은 축제끼리 묶기 → 반복 축제만 → 예측 -->
    <section class="cal-funnel" aria-labelledby="funnel-title">
      <h2 id="funnel-title"></h2>
      <ol id="funnel" class="funnel"></ol>
    </section>

    <!-- 월별 분포(보고서 11쪽): 4~5월 강조 -->
    <section class="cal-bars" aria-labelledby="bars-title">
      <div class="bars-head"><h2 id="bars-title"></h2><p id="bars-note" class="bars-note"></p></div>
      <div id="bars" class="bars" role="list"></div>
      <details class="bars-table"><summary id="bars-table-toggle"></summary><div id="bars-table"></div></details>
    </section>

    <section class="cal-about" aria-labelledby="about-title">
      <h2 id="about-title"></h2>
      <p id="about-text"></p>
      <ul id="legend" class="legend"></ul>
    </section>

    <section class="cal-controls" aria-label="Filters">
      <div class="ctl-row">
        <div id="conf-chips" class="chips" role="group"></div>
        <div id="view-chips" class="chips view" role="group"></div>
      </div>
      <nav id="month-nav" class="month-nav" aria-label="Months"></nav>
    </section>

    <div id="months"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="updated"></p>
      <p id="source"></p>
      <p id="gt-note">번역 기능은 Google 번역을 사용하며, 번역 버튼을 누르면 화면의 글이 Google로 전송됩니다(개인정보는 포함되지 않음). · Translation uses Google Translate; page text is sent to Google only after you tap Translate.</p>
    </div>
  </footer>

  <script src="calendar.js?v=20261007b"></script>
  <script src="../gt.js?v=20261007b"></script>
</body>
</html>
