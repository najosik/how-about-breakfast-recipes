<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 외부 스크립트·인라인 스크립트 금지, 이미지는 https만 허용 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com https://translate.googleapis.com; img-src 'self' https: data:; connect-src 'self' https://translate.googleapis.com https://translate-pa.googleapis.com; frame-src https://translate.google.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- 테스트 기간: 검색엔진 색인 제외. 정식 공개 시 삭제 -->
  <meta name="robots" content="noindex, nofollow">
  <title>Seoul Now</title>
  <meta name="description" content="Concerts, exhibitions, festivals and other culture events happening in Seoul today, this weekend and this month.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261007b">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1 id="site-title" class="notranslate">Seoul Now</h1>
        <p id="site-sub" class="sub"></p>
        <a id="cal-link" class="cal-link" href="calendar/"></a>
      </div>
      <div class="gt-wrap notranslate">
        <button id="gt-btn" class="lang-btn" type="button" aria-label="Translate this page · 페이지 번역">🌐 Translate · 번역</button>
        <div id="google_translate_element" hidden></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="demo-banner" class="banner" hidden></p>

    <!-- 선별 흐름: 수집 → 1차 선별(관광부문) → 2차 선별(외국인 적합도). 단계를 누르면 그 단계까지 적용된 목록 -->
    <section id="stages" class="stages" aria-labelledby="stages-title" hidden>
      <div class="stages-head">
        <h2 id="stages-title"></h2>
        <p id="basis" class="basis"></p>
      </div>
      <ol id="stage-steps" class="stage-steps"></ol>
      <details class="fit-more">
        <summary id="s1-toggle"></summary>
        <p id="s1-lead" class="note"></p>
        <div id="s1-rules" class="fit-rules"></div>
        <p id="s1-foot" class="note"></p>
      </details>
    </section>

    <!-- 2차 선별(외국인 적합도) 기준·결과: 1차 통과 행사만 집계 -->
    <section id="fit" class="fit" aria-labelledby="fit-title" hidden>
      <div class="fit-head">
        <h2 id="fit-title"></h2>
        <p id="fit-lead" class="fit-lead"></p>
      </div>
      <ul id="fit-stats" class="fit-stats"></ul>
      <details class="fit-more">
        <summary id="fit-toggle"></summary>
        <div id="fit-rules" class="fit-rules"></div>
        <p id="fit-foot" class="note"></p>
      </details>
    </section>

    <section class="filters" aria-label="Filters">
      <div class="filter-row">
        <span class="filter-label" id="lbl-when"></span>
        <div id="when-chips" class="chips" role="group" aria-labelledby="lbl-when"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label" id="lbl-type"></span>
        <div id="cat-chips" class="chips" role="group" aria-labelledby="lbl-type"></div>
      </div>
      <div class="filter-row controls">
        <label class="field">
          <span id="lbl-search" class="visually-hidden"></span>
          <input id="q" type="search" maxlength="50" autocomplete="off">
        </label>
        <label class="field">
          <span id="lbl-district" class="visually-hidden"></span>
          <select id="district"></select>
        </label>
        <label class="field">
          <span id="lbl-sort" class="visually-hidden"></span>
          <select id="sort"></select>
        </label>
        <label class="check">
          <input id="free" type="checkbox">
          <span id="lbl-free"></span>
        </label>
        <label class="check" id="fit-filter" hidden>
          <input id="fitonly" type="checkbox">
          <span id="lbl-fit"></span>
        </label>
      </div>
    </section>

    <div class="result-bar">
      <p id="count" aria-live="polite"></p>
      <button id="reset" class="link-btn" type="button"></button>
    </div>
    <p id="ko-note" class="note"></p>
    <p id="fit-note" class="note" hidden></p>
    <p class="export-row"><button id="export" class="link-btn" type="button" hidden></button> <span id="export-note" class="note" aria-live="polite"></span></p>

    <ul id="list" class="grid"></ul>
    <p id="empty" class="empty" hidden></p>
    <div class="more-wrap"><button id="more" class="more-btn" type="button" hidden></button></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="updated"></p>
      <p id="source"></p>
      <p id="gt-note">번역 기능은 Google 번역을 사용하며, 번역 버튼을 누르면 화면의 글이 Google로 전송됩니다(개인정보는 포함되지 않음). · Translation uses Google Translate; page text is sent to Google only after you tap Translate.</p>
    </div>
  </footer>

  <dialog id="detail" aria-labelledby="d-title">
    <article class="detail">
      <button id="d-close" class="close-btn" type="button" aria-label="Close">×</button>
      <div id="d-body"></div>
    </article>
  </dialog>

  <script src="i18n.js?v=20261007b"></script>
  <script src="app.js?v=20261007b"></script>
  <script src="gt.js?v=20261007b"></script>
</body>
</html>
