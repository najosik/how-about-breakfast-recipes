<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Seoul AI Concierge · 내부 시연용</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15"/><path d="M8 20h16M10 20l2-7h8l2 7M13 13l1-4h4l1 4"/></svg>
          <div class="brand-text">
            <h1 id="title">Seoul Concierge</h1>
            <span id="ai-pill" class="ai-pill">AI</span>
          </div>
        </div>
        <div class="top-actions">
          <button id="handoff" class="ghost-btn" type="button"></button>
          <label class="lang">
            <span id="lang-label" class="sr-only">Language</span>
            <select id="lang" aria-labelledby="lang-label">
              <option value="auto">🌐 Auto</option>
              <option value="ko">한국어</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
            </select>
          </label>
        </div>
      </div>
      <p id="demo-banner" class="demo-banner" role="note"></p>
    </header>

    <main id="log" class="log" aria-live="polite" aria-relevant="additions"></main>

    <footer class="composer">
      <div id="suggestions" class="suggestions" role="group"></div>
      <form id="form" class="input-row" autocomplete="off">
        <label for="input" class="sr-only" id="input-label">Message</label>
        <textarea id="input" rows="1" maxlength="1000" required></textarea>
        <button id="send" type="submit" class="send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
      <p class="hint"><span id="disclaimer"></span> <span id="counter" class="counter">0/1000</span></p>
      <p class="hint" id="privacy"></p>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
