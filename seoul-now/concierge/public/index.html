<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Seoul AI Concierge · 내부 시연용</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <p id="demo-banner" class="demo-banner" role="note">서울관광재단 내부 시연용 프로토타입 · 실제 결제·예약 없음</p>
      <div class="top-row">
        <h1 id="title">Seoul AI Concierge</h1>
        <label class="lang">
          <span id="lang-label" class="sr-only">Language</span>
          <select id="lang" aria-labelledby="lang-label">
            <option value="auto">Auto</option>
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
          </select>
        </label>
      </div>
    </header>

    <main id="log" class="log" aria-live="polite" aria-relevant="additions"></main>

    <footer class="composer">
      <div id="suggestions" class="suggestions" role="group"></div>
      <button id="handoff" class="handoff" type="button"></button>
      <form id="form" class="input-row" autocomplete="off">
        <label for="input" class="sr-only" id="input-label">Message</label>
        <textarea id="input" rows="1" maxlength="1000" required></textarea>
        <button id="send" type="submit" class="send"></button>
      </form>
      <p class="hint"><span id="counter">0/1000</span> · <span id="privacy"></span></p>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
